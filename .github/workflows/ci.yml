name: CI

# Tests and manifest checks on all three systems against a pinned Claude Code, and on Linux against
# the latest build as an early warning. No model call, no secret. The type check is not here: the
# plugin API declarations are only written by a logged-in Claude Code, so it runs locally (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, claude ${{ matrix.claude }})
    runs-on: ${{ matrix.os }}
    # The latest build may change the plugin API before the skin catches up: it reports, never blocks.
    continue-on-error: ${{ matrix.claude == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        claude: ['2.1.308']
        include:
          - os: ubuntu-latest
            claude: latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}

      - name: Validate the marketplace and plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

      - name: Engine tests
        run: claude plugin test .
